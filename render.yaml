databases:
  - name: majustwe_db
    databaseName: majustwe
    user: majustwe_user

services:
  - type: web
    name: majustwe-backend
    env: python
    rootDir: backend
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: majustwe_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: ALLOWED_HOSTS
        value: '*'
      - key: DEBUG
        value: 'False'
